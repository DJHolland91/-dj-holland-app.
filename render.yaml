services:
  - type: web
    name: dj-holland-app
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_API_VERSION
        sync: false
      - key: IG_API_HOST
        value: https://graph.instagram.com
